<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="p-5">
    <h1>Exercício JQuery - 01</h1>
    <button id="abrirModal" class="btn btn-primary">
        Abrir Modal
    </button>
    <div class="modal fade" id="minhaModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Janela Modal</h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    Clique no botão para mudar a cor do fundo.
                </div>

                <div class="modal-footer">
                    <button id="mudarCor" class="btn btn-success">
                        Mudar Cor
                    </button>
                </div>

            </div>
        </div>
    </div>
    <script>
        $(function () {
            $("#abrirModal").click(function () {

                $("#minhaModal").modal("show");

            });

            $("#mudarCor").click(function () {

                var cor = "#" + Math.floor(Math.random() * 16777215).toString(16);

                $("body").css("background-color", cor);
            });
        });
    </script>
</body>
</html>
